[package]
name = "sootmark-intake"
version = "0.7.3"
edition = "2021"
rust-version = "1.80"
description = "Evidence intake: read directories, zips, disk images (E01, VHDX, raw) and AD1 logical images, recognise KAPE and Velociraptor collections, detect which parser handles each file."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/intake"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
common = { package = "sootmark-common", version = "0.3.6" }
model = { package = "sootmark-model", version = "0.2.0" }
disk = { package = "sootmark-disk", version = "0.3.0" }
ewf = { package = "sootmark-ewf", version = "0.1.3" }
vhdx = { package = "sootmark-vhdx", version = "0.1.4" }
zip = { package = "sootmark-zip", version = "0.3.0" }
ad1 = { package = "sootmark-ad1", version = "0.1.2" }
# Cryptography is never written in-house (D11): RustCrypto, MIT OR Apache-2.0.
# RSA-OAEP (SHA-512) unwraps the password of X509-encrypted Velociraptor
# collections; base64ct is already in rsa's tree (PEM).
rsa = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
base64ct = { version = "1", features = ["alloc"], optional = true }

[features]
default = ["x509"]
# X509-encrypted Velociraptor collections (RSA). Off for wasm32 builds.
x509 = ["dep:rsa", "dep:sha2", "dep:base64ct"]

[dev-dependencies]
adapters = { package = "sootmark-adapters", version = "0.2.0" }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
